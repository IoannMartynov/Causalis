name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version segment to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  actions: write
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Compute next version tag
        id: next_tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          bump = os.environ["BUMP"]
          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          tag_pattern = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"],
              text=True,
          ).splitlines()

          versions = []
          for tag in tags:
              match = tag_pattern.fullmatch(tag.strip())
              if match:
                  versions.append(tuple(int(part) for part in match.groups()))

          if versions:
              major, minor, patch = max(versions)
          else:
              config = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
              fallback = config["tool"]["setuptools_scm"]["fallback_version"]
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", fallback)
              if not match:
                  raise SystemExit(
                      "fallback_version must be plain semver when no release tags exist."
                  )
              major, minor, patch = (int(part) for part in match.groups())

          if bump == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump == "minor":
              minor += 1
              patch = 0
          else:
              patch += 1

          tag = f"v{major}.{minor}.{patch}"
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"tag={tag}\n")
          print(f"Next release tag: {tag}")
          PY

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ steps.next_tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Dispatch release workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.next_tag.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"
